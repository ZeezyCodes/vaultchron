name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feat/**' # Trigger CI on feature branches to ensure platform parity before PR
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: false

      - name: Verify formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted properly:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build -v ./...

      - name: Run tests with race detector and coverage
        run: go test -v -race -cover ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: $(go env GOPATH)/bin/govulncheck ./...

      - name: Shell syntax check
        run: |
          sh -n install.sh
          bash -n deploy/vaultchron.sh

  windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: false

      - name: Go build
        run: go build -v ./...

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      # Report parse results even when tests fail.
      - name: Parse-check PowerShell scripts and README snippets
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path "deploy/windows" -Filter "*.ps1")
          if ($files.Count -eq 0) {
            Write-Error "No PowerShell scripts found in deploy/windows"
            exit 1
          }
          $files = $files + @(Get-Item "install.ps1")
          foreach ($file in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              Write-Error "Parse errors in $($file.FullName):"
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
            Write-Host "Parsed $($file.FullName): OK"
          }

          $readme = Get-Content -Raw "README.md"
          $pattern = '(?ms)```powershell\s*\r?\n(.*?)```'
          $matches = [regex]::Matches($readme, $pattern)
          if ($matches.Count -eq 0) {
            Write-Error "Zero powershell blocks found in README.md"
            exit 1
          }
          Write-Host "Found $($matches.Count) powershell block(s) in README.md"
          for ($i = 0; $i -lt $matches.Count; $i++) {
            $code = $matches[$i].Groups[1].Value
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($code, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              Write-Error "Parse errors in README.md powershell block $($i + 1):"
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
            Write-Host "Parsed README powershell block $($i + 1): OK"
          }

  macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: false

      - name: Go build
        run: go build -v ./...

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      - name: Lint launchd plist
        run: plutil -lint deploy/macos/io.github.zeezycodes.vaultchron.plist
